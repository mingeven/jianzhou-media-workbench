name: Cloud preview checks

on:
  push:
    branches: [feature/cloud-preview]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIANZHOU_DEMO: "1"
      JIANZHOU_DATA_DIR: ${{ runner.temp }}/jianzhou-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app app.py tests
      - run: python -m unittest discover -s tests -v
