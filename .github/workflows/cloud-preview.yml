name: Cloud preview checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIANZHOU_DEMO: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app app.py tests
      - name: Run unit tests with isolated data
        run: |
          export JIANZHOU_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/jianzhou-test.XXXXXX")"
          python -m unittest discover -s tests -v
